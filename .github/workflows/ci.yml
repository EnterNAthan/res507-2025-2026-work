name: CI

on:
  push:
  pull_request:

jobs:
  test-app:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: labs/40-containerized-node-app/app/package-lock.json

      - name: Install dependencies
        working-directory: labs/40-containerized-node-app/app
        run: npm ci

      - name: Run tests
        working-directory: labs/40-containerized-node-app/app
        run: npm test --if-present

  # faire le build uniquement si test app passe 
  build-and-verify:
    name: Docker Build & Smoke Test
    needs: test-app 
    runs-on: ubuntu-latest
    
    steps:
      # 
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd labs/40-containerized-node-app
          docker build -t quote-app -f docker/Dockerfile .

      - name: Run container 
        # test sur endpoint 
        run: |
          docker run -d --name quote-app -p 3000:3000 quote-app
          
          echo "Waiting for container to start..."
          for i in $(seq 1 30); do
            # LANE A : Vérification stricte du contenu (doit contenir "ok")
            if curl -fsS http://localhost:3000/health | grep -q "ok"; then
              echo " Health check passed"
              exit 0
            fi
            sleep 1
          done
          
          echo " Health check failed"
          docker logs quote-app
          exit 1
      # stop container 
      - name: Stop container
        if: always()
        run: docker rm -f quote-app || true